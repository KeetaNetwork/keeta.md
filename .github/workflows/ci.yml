name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  # Daily, so a change on the test network or in a provider shows up even without a pull request.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill structure and metadata
        run: python3 .github/scripts/validate-skills.py
      - name: Build keeta.md
        run: python3 .github/scripts/build-site.py _site
      - name: Check the hosted files
        run: |
          test -s _site/llms.txt && test -s _site/llms-full.txt && test -s _site/404.html
          test -s _site/SKILL.md && test -s _site/skill.md
          test -s _site/skills/keeta/SKILL.md && test -s _site/skills/keeta/references/anchors.md
          test -s _site/.well-known/agent-skills/index.json && test -s _site/.well-known/skills/index.json
          test -s _site/_headers && test -s _site/_redirects
          if find _site -name '*.html' ! -name 404.html | grep -q .; then echo "keeta.md serves no HTML pages"; exit 1; fi
          grep -q 'https://keeta-md.pages.dev/skills/x402-payments/SKILL.md' _site/llms.txt
      - name: Check the Pages output directory matches the build
        run: grep -qx 'pages_build_output_dir = "./_site"' wrangler.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Serve the build as Pages does, and install every skill from it with the skills CLI
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          npx --yes wrangler@4.151.0 pages dev _site --port 8788 --ip 127.0.0.1 > pages-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:8788/llms.txt && break; sleep 1; done
          curl -fsS http://127.0.0.1:8788/ | head -1 | grep -qx '# Keeta skills' || { echo "/ does not serve llms.txt"; cat pages-dev.log; exit 1; }
          curl -fsS -D - -o /dev/null http://127.0.0.1:8788/SKILL.md | grep -qi '^content-type: text/markdown; charset=utf-8'
          curl -fsS -D - -o /dev/null http://127.0.0.1:8788/skills/keeta/references/anchors.md | grep -qi '^access-control-allow-origin: \*'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8788/no-such-skill/SKILL.md)" = 404
          npx --yes skills@1.7.0 add http://127.0.0.1:8788 --list | tee skills-list.txt
          for skill in $(python3 -c "import json; print(' '.join(s['name'] for s in json.load(open('_site/.well-known/agent-skills/index.json'))['skills']))"); do
            grep -q "$skill" skills-list.txt || { echo "skills CLI did not list $skill"; exit 1; }
          done

  typecheck:
    name: Typecheck every code block
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/snippets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/snippets/package-lock.json
      - run: npm ci
      - name: Typecheck the TypeScript blocks against the published SDKs
        run: npm run typecheck

  live:
    name: Run the live blocks on the test network
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/snippets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/snippets/package-lock.json
      - run: npm ci
      - name: Run each live-test block with a new wallet on both networks
        run: npm run live

  trials:
    name: Agent trials
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/snippets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/snippets/package-lock.json
      - run: npm ci
      - name: Run the programs agents wrote from the skills, on test (funded) and main (read-only)
        run: npm run trials
